name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ai_teacher
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ai_teacher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_teacher -d ai_teacher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ai_teacher:ci_only_password@localhost:5432/ai_teacher_test
      TEST_DATABASE_URL: postgresql+psycopg://ai_teacher:ci_only_password@localhost:5432/ai_teacher_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check ai_teacher_app.py api core prompts tests alembic

      - name: Unit tests
        run: python -m pytest -m "not integration" -q

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: PostgreSQL repository integration test
        run: python -m pytest tests/test_postgres_integration.py -q

      - name: Compile check
        run: python -m compileall -q ai_teacher_app.py api core prompts tests alembic
