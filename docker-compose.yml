services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_teacher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_teacher_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-ai_teacher}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ai_teacher_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ai_teacher_postgres_data:
